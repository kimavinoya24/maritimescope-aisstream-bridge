services:
  - type: web
    name: maritimescope-pelyr-bridge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: AIS_PROVIDER
        value: pelyr
      - key: PELYR_API_KEY
        sync: false
      - key: PELYR_START_DELAY_MS
        value: '5000'
      - key: PELYR_429_COOLDOWN_MS
        value: '120000'
      - key: PELYR_API_REFRESH_MS
        value: '90000'
      - key: BRIDGE_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: AIS_INGEST_KEY
        sync: false
      - key: AIS_INGEST_PATH
        value: /vessel-sync.php
      - key: AIS_BOXES
        value: '[[[5,115],[10,120]]]'
      - key: ALLOW_GLOBAL_BOXES
        value: 'true'
      - key: MAX_CACHE
        value: '10000'
