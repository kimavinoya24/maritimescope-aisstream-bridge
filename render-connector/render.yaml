services:
  - type: web
    name: maritimescope-openwaters-bridge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: AIS_PROVIDER
        value: openwaters
      - key: OPENWATERS_API_KEY
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
      - key: BRIDGE_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: AIS_INGEST_KEY
        sync: false
      - key: AIS_INGEST_PATH
        value: /vessel-sync.php
      - key: AIS_BOXES
        value: '[[[5,115],[10,120]]]'
      - key: ALLOW_GLOBAL_BOXES
        value: 'false'
      - key: MAX_CACHE
        value: '5000'
