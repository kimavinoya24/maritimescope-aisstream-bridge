services:
  - type: web
    name: maritimescope-aisstream-bridge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: AISSTREAM_API_KEY
        sync: false
      - key: BRIDGE_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: AIS_INGEST_KEY
        sync: false
      - key: AIS_INGEST_PATH
        value: /aisfeed.php
      - key: AIS_BOXES
        value: '[[[0,100],[30,150]]]'
      - key: ALLOW_GLOBAL_BOXES
        value: 'false'
      - key: MAX_CACHE
        value: '5000'
