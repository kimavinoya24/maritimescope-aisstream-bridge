services:
  - type: web
    name: maritimescope-aisstream-bridge
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: AISSTREAM_API_KEY
        sync: false
      - key: BRIDGE_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: AIS_INGEST_KEY
        sync: false
      - key: AIS_INGEST_PATH
        value: /aisfeed.php
      - key: AIS_BOXES
        value: '[[[70,-180],[-70,-60]],[[70,-60],[-70,20]],[[70,20],[-70,100]],[[70,100],[-70,180]]]'
